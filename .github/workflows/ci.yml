name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install . pytest
      - name: Run tests
        run: pytest -q
      - name: Scan the checked-out release surface
        run: python scripts/public_scan.py
